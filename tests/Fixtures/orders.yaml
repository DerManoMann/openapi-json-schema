openapi: 3.1.0
info:
  title: Orders
  version: '1.0'
paths:
  '/orders/{id}':
    get:
      operationId: 3fa4fcc2cabca668cddc8e7c00e41cff
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'The order'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
          default: []
        status:
          type: string
          enum:
            - open
            - shipped
        createdAt:
          type: string
          format: date-time
        billedTo:
          anyOf:
            -
              $ref: '#/components/schemas/Customer'
            -
              type: 'null'
        shippingAddress:
          anyOf:
            -
              $ref: '#/components/schemas/Address'
            -
              type: 'null'
    Customer:
      type: object
      properties:
        name:
          type: string
          description: "The customer's full name."
        email:
          type:
            - string
            - 'null'
    LineItem:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          default: 1
    Address:
      type: object
      description: 'Described by its attributes'
      properties:
        street:
          type: string
      required:
        - street
